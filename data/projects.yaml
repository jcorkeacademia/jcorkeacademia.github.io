# Images live in static/images/projects/.

- title: "Dynamic φ-Divergence Selection for Safe Exploitation in Leduc Hold'em"
  link: /research/phi-divergence-leduc/
  blurb: >-
    How far should you stray from safe play to exploit a weak opponent? We compare six
    φ-divergences as the penalty for deviating from Nash equilibrium in Leduc Hold'em,
    bound the exploitability each one allows, and use a Thompson-sampling bandit to
    pick the right divergence for each level of risk tolerance.
  page: /images/projects/phi-page1.jpg
  page_alt: First page of the paper, with the title and abstract
  figure: /images/projects/phi-figure.jpg
  figure_alt: Pareto frontiers of expected value against exploitability for six divergences

- title: α-Potential Games for Mixed-Autonomy Traffic
  link: /research/alpha-potential-traffic/
  blurb: >-
    How does one safely coordinate autonomous vehicles (CAVs) that share the road with
    human drivers (HDVs)? Taking from game theory, I extend α‑potential games to the mixed
    traffic formulation, modeling HDVs as a density that evolves under an LWR conservation
    law, and derive a bound that keeps approximate Nash equilibria computable as a single
    optimization problem.
  page: /images/projects/alpha-page1.jpg
  page_alt: First page of the report, with the title and introduction
  figure: /images/projects/alpha-bound.jpg
  figure_alt: Section 5 of the report, deriving the alpha bound for the coupled autonomous and human-driven vehicle game

- title: Degree Assortativity Under Graph Unions
  link: /research/network-assortativity/
  blurb: >-
    What happens to a network's assortativity, the tendency of well-connected nodes to
    link to each other, when two networks are merged? I derived bounds for assortativity
    under graph unions and tested them with Monte Carlo simulations across
    Erdős–Rényi, Barabási–Albert and configuration-model graphs.
  image: /images/projects/network-wide.jpg
  image_alt: Union of two random graphs, with nodes sized and colored by degree

- title: "Century: Golem Edition"
  link: /projects/century-golem/
  blurb: >-
    This is a working online version of the board game. I am currently working on making
    this public for anyone to play at any time. What I have done so far includes developing
    tuned bots that learn which features matter most for winning and a solver that searches
    for the fastest possible solo win: roughly 33 turns on average across 500 instances.
  image: /images/projects/century-game.jpg
  image_alt: A five-player game in progress in the online Century Golem Edition, with the golem row, merchant cards and the player's hand
