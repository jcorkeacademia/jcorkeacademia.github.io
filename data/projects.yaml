- title: "Century: Golem Edition"
  link: /projects/century-golem/
  blurb: >-
    This is a working online version of the board game. I am currently working on making
    this public for anyone to play at any time. What I have done so far includes developing
    tuned bots that learn which features matter most for winning and a solver that searches
    for the fastest possible solo win: roughly 33 turns on average across 500 instances.
  image: /images/projects/century-game.jpg
  image_alt: A five-player game in progress in the online Century Golem Edition, with the golem row, merchant cards and the player's hand
