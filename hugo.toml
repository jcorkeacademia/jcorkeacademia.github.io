# The GitHub Actions workflow overrides baseURL automatically when deploying.
baseURL = "https://YOUR-GITHUB-USERNAME.github.io/"
locale = "en-us"
title = "Justin Dorjee Corke"
theme = "hugo-theme-nightfall"

[markup.goldmark.renderer]
  unsafe = true
  hardWraps = true

[menu]
  [[menu.header]]
    name = "research"
    weight = 1
    url = "research/"
  [[menu.header]]
    name = "projects"
    weight = 2
    url = "projects/"
  [[menu.header]]
    name = "cv"
    weight = 3
    url = "cv/"

[params]
  user = "justin"
  hostname = "corke"
  SiteDescription = "Justin Dorjee Corke: statistician working on game theory, multi-agent systems and networks."
  openLinksInNewTab = true
  showMetadata = false
  footerHtml = "© 2026 Justin Dorjee Corke · built with <a class='footerLink' href='https://gohugo.io'>Hugo</a> and <a class='footerLink' href='https://github.com/LordMathis/hugo-theme-nightfall'>Nightfall</a>"

  # Show the "Stuff I do" list under your photo (edit the links in data/interests.yaml)
  showInterests = false

  # Seconds each project stays on screen in the homepage slideshow
  slideSeconds = 8

  [params.styles]
    color = "blue"

  [params.author]
    name = "Justin Dorjee Corke"
    email = "jcorkeacademia@gmail.com"
    photo = "/images/me.jpg"

